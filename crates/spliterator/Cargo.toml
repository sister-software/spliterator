[package]
name = "spliterator"
description = "Streaming readers for delimited text, CSV, TSV and JSONL with transparent zstd/gzip decompression. The Rust counterpart of the spliterator npm package, sharing its semantics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# The conformance runner reads fixtures from the repository root, so it does not travel with the package.
include = ["src/**", "README.md", "LICENSE.md", "Cargo.toml"]
keywords = ["csv", "jsonl", "tsv", "streaming", "delimited"]
categories = ["parser-implementations", "encoding"]

[features]
default = ["zstd", "gzip", "json"]
zstd = ["dep:zstd"]
gzip = ["dep:flate2"]
json = ["dep:serde_json"]

[dependencies]
memchr = "2.7"
regex = { version = "1.10", default-features = false, features = [
	"std",
	"unicode-perl",
	"unicode-gencat",
	"unicode-case",
] }
zstd = { version = "0.14", optional = true }
flate2 = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
serde_json = "1.0"
base64 = "0.22"
