# Publish `sister-software-spliterator` (imported as `spliterator`) to PyPI: abi3 wheels for CPython >= 3.11 on every
# platform below, plus an sdist.
#
# DISPATCHED BY publish.yml after it tags and publishes npm, against the tag (`--ref v<version>`), so the wheels build
# from exactly the release commit. Dispatch it by hand with the same ref to retry: a version already on PyPI is skipped
# before anything builds. A dispatch from a branch is refused unless `dry_run` is set, which builds and tests every
# wheel and uploads nothing.
#
# AUTH: PyPI Trusted Publishing (OIDC), matched by this file's path (`.github/workflows/publish-pypi.yml`) and the
# `pypi` environment. A project that does not exist yet is configured as a "pending publisher" on PyPI with the same
# four values: owner `sister-software`, repository `spliterator`, this workflow file, environment `pypi`.
#
# The PyPI version comes from Cargo.toml through maturin, which spells a Cargo prerelease the PEP 440 way:
# `10.1.0-rc.1` becomes `10.1.0rc1`.
name: PyPI Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build and test every wheel, upload nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read and check the version
        id: version
        run: |
          set -euo pipefail
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "spliterator-py") | .version')"
          NPM_VERSION="$(node -p "require('./package.json').version")"
          VERSION="$(echo "${CARGO_VERSION}" | sed -E 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/')"
          echo "wheel ${VERSION} (Cargo ${CARGO_VERSION}), npm ${NPM_VERSION}, ref ${GITHUB_REF}"
          if [ "${CARGO_VERSION}" != "${NPM_VERSION}" ]; then
            echo "::error::Cargo.toml says ${CARGO_VERSION} but package.json says ${NPM_VERSION}"; exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/tags/v${CARGO_VERSION}" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "::error::publish from the release tag (dispatch with --ref v${CARGO_VERSION}), not ${GITHUB_REF}"; exit 1
          fi
          if curl -sf "https://pypi.org/pypi/sister-software-spliterator/${VERSION}/json" >/dev/null; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::sister-software-spliterator ${VERSION} is already on PyPI (recovery re-run) — nothing to build"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  wheels:
    needs: check
    if: ${{ needs.check.outputs.published != 'true' }}
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners wherever one exists: libzstd is C, and building it for the host avoids a cross toolchain.
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto, test: true }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, test: false }
          - {
              name: musllinux-aarch64,
              runner: ubuntu-24.04-arm,
              target: aarch64,
              manylinux: musllinux_1_2,
              test: false,
            }
          - { name: macos-arm64, runner: macos-latest, target: aarch64, manylinux: "", test: true }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64, manylinux: "", test: false }
          - { name: windows-x64, runner: windows-latest, target: x64, manylinux: "", test: true }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/spliterator-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist

      - name: Test the wheel
        if: ${{ matrix.test }}
        shell: bash
        run: |
          python -m pip install crates/spliterator-py/dist/*.whl pytest
          # From outside the package directory, so the installed wheel is what imports, not the source tree.
          cd "${RUNNER_TEMP}"
          python -m pytest -q -p no:cacheprovider "${GITHUB_WORKSPACE}/crates/spliterator-py/tests"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: crates/spliterator-py/dist/*.whl
          if-no-files-found: error

  sdist:
    needs: check
    if: ${{ needs.check.outputs.published != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/spliterator-py
          command: sdist
          args: --out dist

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: crates/spliterator-py/dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [check, wheels, sdist]
    if: ${{ needs.check.outputs.published != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC)

    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Check the distributions
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          for file in dist/*; do
            case "$(basename "${file}")" in
              sister_software_spliterator-"${VERSION}"-*.whl | sister_software_spliterator-"${VERSION}".tar.gz) ;;
              *) echo "::error::$(basename "${file}") is not version ${VERSION}"; exit 1 ;;
            esac
          done
          test "$(ls dist/*.whl | wc -l)" -eq 7 || { echo "::error::expected 7 wheels"; exit 1; }

      - name: "Dry run: summary and stop"
        if: ${{ inputs.dry_run }}
        run: echo "::notice::DRY RUN — built and checked sister-software-spliterator ${{ needs.check.outputs.version }}; nothing uploaded."

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify the published version
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            if curl -sf "https://pypi.org/pypi/sister-software-spliterator/${VERSION}/json" >/dev/null; then
              echo "sister-software-spliterator ${VERSION} is live"; exit 0
            fi
            echo "attempt ${attempt}: not visible yet"
            sleep 15
          done
          echo "::error::sister-software-spliterator ${VERSION} is not visible on PyPI after 5 minutes"
          exit 1
